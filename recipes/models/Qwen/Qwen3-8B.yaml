meta:
  title: "Qwen3-8B"
  slug: "qwen3-8b"
  provider: "Qwen"
  description: "Qwen3 8.2B dense model with hybrid thinking/non-thinking modes, validated for BF16 serving on Intel Xeon 6 and single-node RTX 3090 layouts."
  date_added: 2026-08-14
  date_updated: 2026-10-28
  tasks:
    - text
  performance_headline: "BF16 serving validated on Intel Xeon 6 and RTX 3090"
  related_recipes:
    - "Qwen/Qwen3-4B"
    - "Qwen/Qwen3-32B"
  hardware:
    xeon6: verified
    rtx_3090: verified
    rtx_3090_4x: verified
  default_hardware: xeon6

model:
  model_id: "Qwen/Qwen3-8B"
  min_vllm_version: "0.8.5"
  architecture: dense
  parameter_count: "8.2B"
  active_parameters: "8.2B"
  context_length: 40960
  base_args: []
  base_env: {}

features:
  tool_calling:
    description: "Enable automatic tool choice with the Hermes parser"
    args:
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "hermes"
  reasoning:
    description: "Enable Qwen3 thinking mode with the Qwen3 reasoning parser"
    args:
      - "--reasoning-parser"
      - "qwen3"
  long_context:
    description: "YaRN RoPE scaling to the model card's validated 131,072-token context. Static YaRN holds the scaling factor constant regardless of input length, so leave this off unless you actually serve long prompts — it can cost quality below 32K."
    args:
      - "--hf-overrides"
      - '{"max_position_embeddings":131072,"rope_parameters":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":32768}}'
      - "--max-model-len"
      - "131072"

opt_in_features:
  - long_context

hardware_opt_in_features:
  rtx_3090:
    - tool_calling
    - reasoning
  rtx_3090_4x:
    - tool_calling
    - reasoning

variants:
  default:
    precision: bf16
    vram_minimum_gb: 20
    description: "Full precision BF16"
    supported_hardware: [xeon6, rtx_3090, rtx_3090_4x]
    tp:
      rtx_3090: 1
      rtx_3090_4x: 4
    hardware_overrides:
      rtx_3090:
        extra_args:
          - "--dtype"
          - "bfloat16"
          - "--max-model-len"
          - "8192"
          - "--gpu-memory-utilization"
          - "0.9"
      rtx_3090_4x:
        extra_args:
          - "--dtype"
          - "bfloat16"
          - "--max-model-len"
          - "8192"
          - "--gpu-memory-utilization"
          - "0.9"

compatible_strategies:
  - single_node_tp
  - multi_node_tp

hardware_overrides:
  cpu:
    extra_args:
      - "--max-num-batched-tokens"
      - "16384"
      - "--gpu-memory-utilization"
      - "0.8"

strategy_overrides: {}

guide: |
  ## Overview

  Qwen3-8B is a dense Qwen3 model with hybrid thinking and non-thinking modes.
  This recipe includes an Intel Xeon 6 CPU configuration validated with BF16
  serving.
  A single-card RTX 3090 BF16 configuration also passed chat serving and
  fixed-length streaming benchmarks.
  Four-card PCIe layouts were measured separately as described below.

  ## Prerequisites

  - Hardware: 2x Xeon 6 CPUs
  - vLLM >= 0.8.5

  ### pip (Intel Xeon 6 CPUs)

  For Intel and AMD x86 CPUs, follow the
  [CPU pre-built wheels](https://docs.vllm.ai/en/latest/getting_started/installation/cpu/#pre-built-wheels)
  installation instructions.

  ### Docker (Intel Xeon 6 CPUs)

  ```bash
  docker pull vllm/vllm-openai-cpu:latest-x86_64
  ```

  ## Intel Xeon 6

  Choose the tensor parallel size based on the system topology and deployment
  requirements. Add `--tensor-parallel-size <N>` when needed; the recipe does
  not prescribe a Xeon 6 TP value or hard-code NUMA node IDs.

  ```bash
  vllm serve Qwen/Qwen3-8B \
    --max-num-batched-tokens 16384 \
    --gpu-memory-utilization 0.8
  ```

  Docker:

  ```bash
  docker run \
    --privileged --ipc=host -p 8000:8000 \
    -v ~/.cache/huggingface:/root/.cache/huggingface \
    vllm/vllm-openai-cpu:latest-x86_64 Qwen/Qwen3-8B \
    --tensor-parallel-size 1 \
    --max-num-batched-tokens 16384 \
    --gpu-memory-utilization 0.8 \
    --enable-auto-tool-choice \
    --tool-call-parser hermes \
    --reasoning-parser qwen3
  ```

  ## NVIDIA RTX 3090

  Serving ran on one 24 GiB RTX 3090 (Ampere, SM86) using vLLM source
  commit `9fc019a749cbf3235cc06aa5357b17fd37cb648a`, matching precompiled
  extensions, and PyTorch 2.14 with CUDA 13.0 in a local virtual environment.
  The configuration used BF16, tensor parallel size 1, an 8192-token maximum
  model length, and GPU memory utilization 0.9, with the default V2 runner,
  asynchronous scheduling, FlashAttention 2, and CUDA Graphs. A chat request
  asking for 2 + 2 returned 4 with `finish_reason: stop`.

  Streaming benchmarks covered input/output lengths of 512/128, 4096/128,
  and 256/512 tokens at concurrency 1 and 8. Each point used three measured
  runs after warmup; all 864 measured requests completed successfully.
  Prefix caches were reset between runs, output length was fixed with
  `--ignore-eos`, and profiling was performed separately from timing.
  This validates those workloads, not full 8192-token capacity or model quality.

  Tool calling and reasoning parsing have not been validated on this GPU and
  are opt-in for this profile; long context / YaRN remains opt-in and unvalidated
  here. GPU Docker deployment has not been validated. Quantized variants, other
  GPUs, and multi-GPU layouts are not certified by this single-card result.
  The existing Xeon configuration and default hardware selection are unchanged.

  ### Four PCIe-connected RTX 3090s

  The `rtx_3090_4x` profile renders TP=4, DP=1 with the same BF16, 8192-token
  maximum length and 0.9 memory utilization settings. On the source commit
  above, this layout completed three 64-request streaming runs with 512-token
  input, 128-token output and concurrency 8. Standard NCCL worked without
  NVLink; custom all-reduce was disabled on this PCIe-only system.

  This is a validated TP configuration, not a claim that maximum TP is fastest.
  The same seven-layout comparison selected TP=2, DP=2 for highest mean output
  throughput. The recipe builder's TP strategy still means pure tensor
  parallelism; use the native mixed-layout command below or the recipe tools'
  GPU layout sweep rather than labeling DP as a TP-only strategy.

  ```bash
  vllm serve Qwen/Qwen3-8B \
    --dtype bfloat16 \
    --max-model-len 8192 \
    --gpu-memory-utilization 0.9 \
    --tensor-parallel-size 2 \
    --data-parallel-size 2
  ```

  All 1344 measured requests across TP/DP layouts 1/1, 1/2, 1/3, 1/4, 2/1,
  2/2 and 4/1 succeeded. More GPUs, a different request concurrency or longer
  inputs can change the preferred layout. These measurements do not certify
  GPU Docker, multi-node deployment, full-context capacity or model quality.

  ## Client Usage

  ```python
  from openai import OpenAI

  client = OpenAI(base_url="http://localhost:8000/v1", api_key="unused")
  response = client.chat.completions.create(
      model="Qwen/Qwen3-8B",
      messages=[{"role": "user", "content": "Explain tensor parallelism briefly."}],
  )
  print(response.choices[0].message.content)
  ```

  ## References

  - [Model card](https://huggingface.co/Qwen/Qwen3-8B)
  - [vLLM CPU installation](https://docs.vllm.ai/en/latest/getting_started/installation/cpu/)
